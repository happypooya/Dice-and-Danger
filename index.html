<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeons, Dice & Danger - Game Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121214;
      color: #e4e4e7;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }
    header {
      width: 100%;
      max-width: 1280px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f1f23;
      padding: 10px 18px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .version-tag {
      font-size: 11px;
      color: #71717a;
      font-family: monospace;
      font-weight: normal;
      margin-left: 8px;
    }
    .main-layout {
      display: flex;
      gap: 16px;
      max-width: 1280px;
      width: 100%;
    }
    #game-container {
      position: relative;
      flex: 1;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      align-self: flex-start;
    }
    #board-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }
    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .panel {
      width: 320px;
      background: #1f1f23;
      padding: 16px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .dice-group {
      display: flex;
      gap: 6px;
      margin: 8px 0;
    }
    .die {
      width: 42px;
      height: 42px;
      background: #fff;
      color: #000;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .die.black {
      background: #000;
      color: #fff;
      border: 1px solid #444;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.active { background: #16a34a; }
    button.danger { background: #dc2626; }
    .history-log {
      background: #27272a;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      max-height: 200px;
      overflow-y: auto;
    }
    .calib-banner {
      width: 100%;
      max-width: 1280px;
      background: #b91c1c;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h2>Dungeons, Dice & Danger Engine <span class="version-tag">v0.2.1</span></h2>
    <div>
      <button onclick="undoMark()">↩ Undo Last Mark</button>
      <button id="btn-mode" onclick="toggleCalibration()">🔧 Toggle Calibration Mode</button>
      <button onclick="clearMarks()" class="danger">Reset Game</button>
    </div>
  </header>

  <div id="calib-banner" class="calib-banner" style="display: none;">
    <span>
      <strong>CALIBRATION EDIT MODE:</strong> 
      <button id="btn-lock-edit" onclick="toggleEditLock()" style="background:#2563eb; color:#fff; margin-left:10px; padding:3px 8px; font-size:12px;">✏️ Edit/Delete: ENABLED</button>
    </span>
    <button onclick="exportPoints()" style="background:#fff; color:#000;">📋 Copy JSON Data</button>
  </div>

  <div class="main-layout">
    <div id="game-container">
      <img id="board-img" src="https://raw.githubusercontent.com/happypooya/Dice-and-Danger/main/Scan_20261031_124717.jpg" alt="Board">
      <canvas id="overlay-canvas"></canvas>
    </div>

    <div class="panel">
      <h3>Dice Controls</h3>
      <button onclick="rollDice()">🎲 Roll 5 Dice</button>

      <div class="dice-group">
        <div class="die" id="d0">-</div>
        <div class="die" id="d1">-</div>
        <div class="die" id="d2">-</div>
        <div class="die" id="d3">-</div>
        <div class="die black" id="d4">-</div>
      </div>

      <hr style="border-color: #3f3f46;">

      <h3>Action Log</h3>
      <div class="history-log" id="action-log">No actions recorded yet.</div>
    </div>
  </div>

    points.forEach(p => p.marked = false);

    const img = document.getElementById('board-img');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');

    function syncCanvasSize() {
      const w = img.clientWidth;
      const h = img.clientHeight;
      if (w > 0 && h > 0) {
        canvas.width = w;
        canvas.height = h;
      }
    }

    function getValidPairs(diceArr) {
      const pairs = [];
      for (let i = 0; i < diceArr.length; i++) {
        for (let j = i + 1; j < diceArr.length; j++) {
          pairs.push({
            sum: diceArr[i].val + diceArr[j].val,
            isDouble: diceArr[i].val === diceArr[j].val,
            diceIds: [diceArr[i].id, diceArr[j].id]
          });
        }
      }
      return pairs;
    }

    function consumeDiceForSum(sumVal, isDoubleReq) {
      const valid = getValidPairs(poolDice);
      const match = valid.find(p => p.sum === sumVal && (isDoubleReq ? p.isDouble : true));
      if (match) {
        poolDice = poolDice.filter(d => !match.diceIds.includes(d.id));
        return true;
      }
      return false;
    }

    function isMonsterHpBox(label) {
      const l = label.toLowerCase();
      const isMonsterName = l.includes('pup') || l.includes('growler') || l.includes('hare') || l.includes('wolf') || l.includes('hound') || l.includes('bearpion') || l.includes('boss');
      return isMonsterName && !l.endsWith('_target');
    }

    function getNextUnmarkedMonsterBox(prefix) {
      const hpPoints = points.filter(p => p.label.toLowerCase().startsWith(prefix.toLowerCase()) && !p.label.toLowerCase().endsWith('_target'));
      return hpPoints.find(p => !p.marked);
    }

    function toggleEditLock() {
      allowEditingPoints = !allowEditingPoints;
      const btn = document.getElementById('btn-lock-edit');
      btn.textContent = allowEditingPoints ? '✏️ Edit/Delete: ENABLED' : '➕ Add Only Mode (Editing Locked)';
      btn.style.background = allowEditingPoints ? '#2563eb' : '#16a34a';
    }

    function redraw() {
      syncCanvasSize();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const validPairs = poolDice.length >= 2 ? getValidPairs(poolDice) : [];

      points.forEach((p) => {
        const px = p.x * canvas.width;
        const py = p.y * canvas.height;
        const radius = Math.max(8, canvas.width * 0.012);

        const isTargetZone = p.label.toLowerCase().endsWith('_target');
        const isHpBox = isMonsterHpBox(p.label);

        let isHighlighted = false;

        // ONLY highlight portrait targets or regular spaces (never floating HP boxes)
        if (validPairs.length > 0 && !p.marked && !isHpBox) {
          const numVal = parseInt(p.label.replace(/\D/g, ''));
          const isDoubleReq = p.label.includes('double');

          if (!isTargetZone) {
            isHighlighted = validPairs.some(pair => {
              if (numVal && pair.sum === numVal) {
                return isDoubleReq ? pair.isDouble : true;
              }
              if (isDoubleReq && !numVal) return pair.isDouble;
              return false;
            });
          } else {
            // Check if monster has open HP box matching current valid dice sums
            let prefix = p.label.substring(0, p.label.toLowerCase().indexOf('_target'));
            const nextHp = getNextUnmarkedMonsterBox(prefix);
            if (nextHp) {
              const hpNum = parseInt(nextHp.label.replace(/\D/g, ''));
              isHighlighted = validPairs.some(pair => pair.sum === hpNum);
            }
          }
        }

        if (isHighlighted) {
          ctx.fillStyle = 'rgba(234, 179, 8, 0.45)';
          ctx.strokeStyle = '#eab308';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(px, py, isTargetZone ? radius * 1.5 : radius, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        }

        // Draw Damage / Marks
        if (p.marked) {
          if (isHpBox) {
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(px - radius/2, py - radius/2, radius, radius);
          } else {
            ctx.strokeStyle = '#dc2626';
            ctx.lineWidth = Math.max(2, canvas.width / 300);
            ctx.beginPath();
            ctx.moveTo(px - radius, py - radius); ctx.lineTo(px + radius, py + radius);
            ctx.moveTo(px + radius, py - radius); ctx.lineTo(px - radius, py + radius);
            ctx.stroke();
          }
        }

        // Calibration Mode Overlay
        if (calibrationMode) {
          ctx.fillStyle = 'rgba(59, 130, 246, 0.6)';
          ctx.strokeStyle = '#1d4ed8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(px, py, radius * 0.7, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = `${Math.max(10, canvas.width / 110)}px sans-serif`;
          ctx.fillText(p.label, px + radius + 2, py + 3);
        }
      });
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) / rect.width;
      const clickY = (e.clientY - rect.top) / rect.height;

      const threshold = calibrationMode ? 0.008 : 0.03;
      const hitIdx = points.findIndex(p => Math.hypot(p.x - clickX, p.y - clickY) < threshold);

      if (calibrationMode) {
        if (hitIdx >= 0 && allowEditingPoints) {
          const pt = points[hitIdx];
          const action = prompt(`Target "${pt.label}":\nType "1" to EDIT LABEL\nType "2" to DELETE point\nType "3" to CANCEL`, "1");
          if (action === "1") {
            const newLabel = prompt("Enter new label:", pt.label);
            if (newLabel) pt.label = newLabel.trim();
          } else if (action === "2") {
            points.splice(hitIdx, 1);
          }
        } else if (hitIdx < 0 || !allowEditingPoints) {
          const label = prompt("Enter label for new target:");
          if (label) {
            points.push({ label: label.trim(), x: Number(clickX.toFixed(4)), y: Number(clickY.toFixed(4)), marked: false });
          }
        }
      } else {
        if (hitIdx >= 0) {
          const pt = points[hitIdx];
          
          if (pt.label.toLowerCase().endsWith('_target')) {
            let prefix = pt.label.substring(0, pt.label.toLowerCase().indexOf('_target'));
            const hpBox = getNextUnmarkedMonsterBox(prefix);
            if (hpBox) {
              const hpNum = parseInt(hpBox.label.replace(/\D/g, ''));
              if (consumeDiceForSum(hpNum, false)) {
                hpBox.marked = true;
                markHistory.push({ pt: hpBox, consumed: true });
                logAction(`Hit ${prefix} for ${hpNum}`);
              }
            }
          } else {
            const numVal = parseInt(pt.label.replace(/\D/g, ''));
            const isDoubleReq = pt.label.includes('double');

            if (!pt.marked && numVal) {
              if (consumeDiceForSum(numVal, isDoubleReq)) {
                pt.marked = true;
                markHistory.push({ pt: pt, consumed: true });
                logAction(`Marked ${pt.label}`);
              }
            } else {
              pt.marked = !pt.marked;
              markHistory.push({ pt: pt, consumed: false });
              logAction(`Toggled ${pt.label}`);
            }
          }
        }
      }
      redraw();
    });

    function rollDice() {
      poolDice = [0,1,2,3,4].map(id => ({
        id: id,
        val: Math.floor(Math.random() * 6) + 1
      }));

      poolDice.forEach((d, i) => {
        document.getElementById(`d${i}`).textContent = d.val;
      });

      logAction(`Rolled dice: ${poolDice.map(d => d.val).join(', ')}`);
      redraw();
    }

    function undoMark() {
      if (markHistory.length > 0) {
        const last = markHistory.pop();
        last.pt.marked = !last.pt.marked;
        logAction(`Undid mark on ${last.pt.label}`);
        redraw();
      }
    }

    function logAction(msg) {
      const log = document.getElementById('action-log');
      log.innerHTML = `<div>• ${msg}</div>` + log.innerHTML;
    }

    function toggleCalibration() {
      calibrationMode = !calibrationMode;
      document.getElementById('btn-mode').classList.toggle('active', calibrationMode);
      document.getElementById('calib-banner').style.display = calibrationMode ? 'flex' : 'none';
      redraw();
    }

    function clearMarks() {
      if (confirm("Reset all marked spaces?")) {
        points.forEach(p => p.marked = false);
        markHistory = [];
        logAction("Game board reset.");
        redraw();
      }
    }

    function exportPoints() {
      const exportable = points.map(p => ({ label: p.label, x: p.x, y: p.y }));
      navigator.clipboard.writeText(JSON.stringify(exportable, null, 2));
      alert("Updated JSON dataset copied to clipboard!");
    }

    img.onload = () => { syncCanvasSize(); redraw(); };
    window.addEventListener('resize', () => { syncCanvasSize(); redraw(); });
  </script>
</body>
