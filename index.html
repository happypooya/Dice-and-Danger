<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeons, Dice & Danger - Annoyed Animals</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111113;
      color: #f4f4f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }
    header {
      width: 100%;
      max-width: 1280px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #18181b;
      padding: 10px 18px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .main-layout {
      display: flex;
      gap: 16px;
      max-width: 1280px;
      width: 100%;
    }
    #game-container {
      position: relative;
      flex: 1;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    #board-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }
    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .panel {
      width: 320px;
      background: #18181b;
      padding: 16px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .dice-group {
      display: flex;
      gap: 6px;
      margin: 8px 0;
    }
    .die {
      width: 40px;
      height: 40px;
      background: #fff;
      color: #000;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .die.black {
      background: #000;
      color: #fff;
      border: 1px solid #555;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.active { background: #16a34a; }
    button.danger { background: #dc2626; }
    .score-card {
      background: #27272a;
      padding: 12px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
    }
    .total-score {
      font-size: 18px;
      font-weight: bold;
      color: #22c55e;
      border-top: 1px solid #3f3f46;
      padding-top: 6px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h2>Dungeons, Dice & Danger: Annoyed Animals</h2>
    <div>
      <button id="btn-mode" onclick="toggleCalibration()">🔧 Calibration Mode</button>
      <button onclick="resetBoard()" class="danger">Reset Game</button>
    </div>
  </header>

  <div class="main-layout">
    <div id="game-container">
      <img id="board-img" src="https://raw.githubusercontent.com/happypooya/Dice-and-Danger/main/Scan_20261031_124717.jpg" alt="Board" onload="initCanvas()">
      <canvas id="overlay-canvas"></canvas>
    </div>

    <div class="panel">
      <h3>Dice Roller</h3>
      <div>
        <label><input type="checkbox" id="chk-passive"> Passive Turn (Needs Black Die symbol)</label>
      </div>
      <button onclick="rollDice()">🎲 Roll Dice</button>

      <div class="dice-group">
        <div class="die" id="d0">-</div>
        <div class="die" id="d1">-</div>
        <div class="die" id="d2">-</div>
        <div class="die" id="d3">-</div>
        <div class="die black" id="d4">-</div>
      </div>

      <div style="font-size:13px; color:#a1a1aa;" id="pairs-output">Roll to see valid pair sums.</div>

      <hr style="border-color: #27272a;">

      <h3>Automatic Score Sheet</h3>
      <div class="score-card">
        <div class="score-row"><span>Monster VP:</span><span id="score-monsters">0</span></div>
        <div class="score-row"><span>Gold Rewards (2 VP ea):</span><span id="score-gold">0</span></div>
        <div class="score-row"><span>Gem Rewards (3 VP ea):</span><span id="score-gems">0</span></div>
        <div class="score-row"><span>HP Penalty:</span><span id="score-hp">-0</span></div>
        <div class="score-row total-score"><span>TOTAL VP:</span><span id="score-total">0</span></div>
      </div>
    </div>
  </div>

  <script>
    const img = document.getElementById('board-img');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');

    let calibrationMode = false;
    let selectedZone = null;

    // Defined grid regions & targets (percentages based on image dimensions)
    const zones = [
      // Example target zones mapped to canvas coordinates
      { id: 'start_2', type: 'start', val: 2, x: 0.19, y: 0.28, marked: false },
      { id: 'start_9', type: 'start', val: 9, x: 0.19, y: 0.33, marked: false },
      { id: 'start_6', type: 'start', val: 6, x: 0.19, y: 0.38, marked: false },
      
      // Monster: Purple Howler Life Boxes
      { id: 'p_howler_1', type: 'monster_box', monster: 'Purple Howler', x: 0.29, y: 0.26, marked: false },
      { id: 'p_howler_2', type: 'monster_box', monster: 'Purple Howler', x: 0.29, y: 0.29, marked: false },
      { id: 'p_howler_3', type: 'monster_box', monster: 'Purple Howler', x: 0.29, y: 0.32, marked: false },
      { id: 'p_howler_4', type: 'monster_box', monster: 'Purple Howler', x: 0.29, y: 0.35, marked: false }
    ];

    function initCanvas() {
      canvas.width = img.naturalWidth || img.clientWidth;
      canvas.height = img.naturalHeight || img.clientHeight;
      redraw();
    }

    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      zones.forEach(z => {
        const px = z.x * canvas.width;
        const py = z.y * canvas.height;
        const size = canvas.width * 0.022;

        if (z.marked) {
          // Draw a precise red X fitted directly inside the box
          ctx.strokeStyle = '#e11d48';
          ctx.lineWidth = Math.max(2, canvas.width / 350);
          ctx.beginPath();
          ctx.moveTo(px - size/2, py - size/2); ctx.lineTo(px + size/2, py + size/2);
          ctx.moveTo(px + size/2, py - size/2); ctx.lineTo(px - size/2, py + size/2);
          ctx.stroke();
        }

        if (calibrationMode) {
          ctx.strokeStyle = z === selectedZone ? '#f59e0b' : '#3b82f6';
          ctx.lineWidth = 2;
          ctx.strokeRect(px - size/2, py - size/2, size, size);
        }
      });

      calculateScore();
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) / rect.width;
      const clickY = (e.clientY - rect.top) / rect.height;

      // Find closest zone
      const hit = zones.find(z => Math.hypot(z.x - clickX, z.y - clickY) < 0.025);

      if (calibrationMode && hit) {
        selectedZone = hit;
      } else if (hit) {
        hit.marked = !hit.marked;
      }
      redraw();
    });

    function rollDice() {
      const isPassive = document.getElementById('chk-passive').checked;
      const white = [0,1,2,3].map(() => Math.floor(Math.random() * 6) + 1);
      const black = Math.floor(Math.random() * 6) + 1;

      white.forEach((v, i) => document.getElementById(`d${i}`).textContent = v);
      document.getElementById('d4').textContent = black;

      const sums = new Set();
      for (let i = 0; i < 4; i++) {
        for (let j = i + 1; j < 4; j++) sums.add(white[i] + white[j]);
      }
      if (!isPassive) white.forEach(w => sums.add(w + black));

      const arr = Array.from(sums).sort((a,b) => a - b);
      document.getElementById('pairs-output').innerHTML = `<strong>Sums:</strong> ${arr.join(', ')}`;
    }

    function calculateScore() {
      // Monster tracking logic
      const howlerBoxes = zones.filter(z => z.monster === 'Purple Howler');
      const howlerDefeated = howlerBoxes.length > 0 && howlerBoxes.every(z => z.marked);
      const monsterVP = howlerDefeated ? 12 : 0; // 12 VP for Purple Howler

      document.getElementById('score-monsters').textContent = monsterVP;
      document.getElementById('score-total').textContent = monsterVP;
    }

    function toggleCalibration() {
      calibrationMode = !calibrationMode;
      document.getElementById('btn-mode').classList.toggle('active', calibrationMode);
      redraw();
    }

    function resetBoard() {
      if (confirm("Reset game board?")) {
        zones.forEach(z => z.marked = false);
        redraw();
      }
    }

    window.addEventListener('resize', initCanvas);
  </script>
</body>
</html>
