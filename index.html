<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeons, Dice & Danger - Game Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121214;
      color: #e4e4e7;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }
    header {
      width: 100%;
      max-width: 1280px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f1f23;
      padding: 10px 18px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .main-layout {
      display: flex;
      gap: 16px;
      max-width: 1280px;
      width: 100%;
    }
    #game-container {
      position: relative;
      flex: 1;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    #board-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }
    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .panel {
      width: 320px;
      background: #1f1f23;
      padding: 16px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .dice-group {
      display: flex;
      gap: 6px;
      margin: 8px 0;
    }
    .die {
      width: 42px;
      height: 42px;
      background: #fff;
      color: #000;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .die.black {
      background: #000;
      color: #fff;
      border: 1px solid #444;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.active { background: #16a34a; }
    button.danger { background: #dc2626; }
    .history-log {
      background: #27272a;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      max-height: 150px;
      overflow-y: auto;
    }
    .calib-banner {
      width: 100%;
      max-width: 1280px;
      background: #b91c1c;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h2>Dungeons, Dice & Danger Engine</h2>
    <div>
      <button onclick="undoMark()">↩ Undo Last Mark</button>
      <button id="btn-mode" onclick="toggleCalibration()">🔧 Toggle Calibration Mode</button>
      <button onclick="clearMarks()" class="danger">Reset Game</button>
    </div>
  </header>

  <div id="calib-banner" class="calib-banner" style="display: none;">
    <span><strong>CALIBRATION EDIT MODE:</strong> Click an empty spot to add a target. Click an existing dot to <strong>Edit, Move, or Delete</strong> it.</span>
    <button onclick="exportPoints()" style="background:#fff; color:#000;">📋 Copy JSON Data</button>
  </div>

  <div class="main-layout">
    <div id="game-container">
      <img id="board-img" src="https://raw.githubusercontent.com/happypooya/Dice-and-Danger/main/Scan_20261031_124717.jpg" alt="Board" onload="initCanvas()">
      <canvas id="overlay-canvas"></canvas>
    </div>

    <div class="panel">
      <h3>Dice Controls</h3>
      <div>
        <label><input type="checkbox" id="chk-passive"> Passive Player Turn</label>
      </div>
      <button onclick="rollDice()">🎲 Roll 5 Dice</button>

      <div class="dice-group">
        <div class="die" id="d0">-</div>
        <div class="die" id="d1">-</div>
        <div class="die" id="d2">-</div>
        <div class="die" id="d3">-</div>
        <div class="die black" id="d4">-</div>
      </div>

      <h4>Pair Totals & Highlights</h4>
      <div id="pairs-output" style="font-size:13px; color:#a1a1aa;">Roll dice to see pair sums and highlight mapped spaces.</div>

      <hr style="border-color: #3f3f46;">

      <h3>Action Log</h3>
      <div class="history-log" id="action-log">No actions recorded yet.</div>
    </div>
  </div>

  <script>
    const img = document.getElementById('board-img');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');

    let calibrationMode = false;
    let availablePairs = []; // Stores { sum: X, isDouble: true/false }
    let markHistory = [];

    // Updated dataset from user
