<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeons, Dice & Danger - Game Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121214;
      color: #e4e4e7;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }
    header {
      width: 100%;
      max-width: 1280px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f1f23;
      padding: 10px 18px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .version-tag {
      font-size: 11px;
      color: #71717a;
      font-family: monospace;
      font-weight: normal;
      margin-left: 8px;
    }
    .banner-notification {
      width: 100%;
      max-width: 1280px;
      background: #eab308;
      color: #000;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 10px;
      text-align: center;
      display: none;
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
    }
    .main-layout {
      display: flex;
      gap: 16px;
      max-width: 1280px;
      width: 100%;
    }
    #game-container {
      position: relative;
      flex: 1;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      align-self: flex-start;
    }
    #board-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }
    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .panel {
      width: 320px;
      background: #1f1f23;
      padding: 16px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .dice-group {
      display: flex;
      gap: 6px;
      margin: 8px 0;
    }
    .die {
      width: 42px;
      height: 42px;
      background: #fff;
      color: #000;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .die.black {
      background: #000;
      color: #fff;
      border: 1px solid #444;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.active { background: #16a34a; }
    button.danger { background: #dc2626; }
    .pairs-display {
      background: #27272a;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pair-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
      margin-right: 4px;
      margin-bottom: 4px;
    }
    .tag-white { background: rgba(234, 179, 8, 0.2); color: #eab308; border: 1px solid #eab308; }
    .tag-black { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #a855f7; }
    .calib-banner {
      width: 100%;
      max-width: 1280px;
      background: #b91c1c;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
  </style>
</head>

    <div>

      <button id="btn-mode" onclick="toggleCalibration()">🔧 Toggle Calibration Mode</button>
      <button onclick="clearMarks()" class="danger">Reset Game</button>
    </div>
  </header>

  <div id="reward-banner" class="banner-notification"></div>

  <div id="calib-banner" class="calib-banner" style="display: none;">

      const h = img.clientHeight;
      if (w > 0 && h > 0) {
        canvas.width = w;
        canvas.height = h;
      }

    function isBottomGemGridPoint(label) {
      const num = parseInt(label.replace(/\D/g, ''));
      return label.toLowerCase().startsWith('gem_') && num >= 1 && num <= 45;
    }

    function isMonsterHpBox(label) {
      const l = label.toLowerCase();
      const isMonsterName = l.includes('pup') || l.includes('growler') || l.includes('hare') || l.includes('wolf') || l.includes('hound') || l.includes('bearpion') || l.includes('boss');
      return isMonsterName && !l.endsWith('_target') && !l.includes('reward') && !l.includes('unlock');
    }

    function isBookkeepingPoint(label) {
      const l = label.toLowerCase();
      return l.startsWith('perk_') || l.startsWith('black_dice') || l.startsWith('life_point') || (l.startsWith('fist_') && !l.includes('double')) || l.includes('reward') || isBottomGemGridPoint(label);
    }

    function getValidPairs(diceArr) {
      const pairs = [];
      for (let i = 0; i < diceArr.length; i++) {
        for (let j = i + 1; j < diceArr.length; j++) {
          const usesBlack = diceArr[i].id === 4 || diceArr[j].id === 4;
          pairs.push({
            sum: diceArr[i].val + diceArr[j].val,
            isDouble: diceArr[i].val === diceArr[j].val,
            usesBlack: usesBlack,
            diceObjects: [diceArr[i], diceArr[j]]
          });
        }
      }
      return pairs;
    }

    function consumeDiceForSum(sumVal, isDoubleReq, isDoubleDoor) {
      const valid = getValidPairs(poolDice);
      let match = null;
      if (isDoubleDoor) {
        match = valid.find(p => p.isDouble && !p.usesBlack) || valid.find(p => p.isDouble);
      } else {
        match = valid.find(p => p.sum === sumVal && (isDoubleReq ? p.isDouble : true) && !p.usesBlack) ||
                valid.find(p => p.sum === sumVal && (isDoubleReq ? p.isDouble : true));
      }

      if (match) {
        const removedIds = match.diceObjects.map(d => d.id);
        poolDice = poolDice.filter(d => !removedIds.includes(d.id));
        return match.diceObjects;
      }
      return null;
    }

    function getMonsterPrefixFromTarget(targetLabel) {
      const l = targetLabel.toLowerCase();
      if (l.startsWith('purple_pup')) return 'purple_pup';
      if (l.startsWith('green_growler')) return 'green_growler';
      if (l.startsWith('grey_hound')) return 'grey_hound';
      if (l.startsWith('white_wolf')) return 'white_wolf';
      if (l.startsWith('primal_hare')) return 'primal_hare';
      if (l.startsWith('punk_hare')) return 'punk_hare';
      if (l.startsWith('beefy_bearpion')) return 'beefy_bearpion_boss';
      return '';
    }

    function getNextUnmarkedMonsterBox(prefix) {
      const targetPrefix = prefix.toLowerCase();
      const hpPoints = points.filter(p => {
        const lbl = p.label.toLowerCase();
        return lbl.startsWith(targetPrefix) && !lbl.endsWith('_target') && !lbl.includes('reward') && !lbl.includes('unlock');
      });
      return hpPoints.find(p => !p.marked);
    }

    function getActiveNumbersForMonster(prefix) {
      const rule = monsterRules[prefix];
      if (!rule) return [];

      const activeNums = [...rule.base];
      for (const [numStr, unlockLabel] of Object.entries(rule.locked)) {
        const num = parseInt(numStr);
        const unlockPoint = points.find(p => p.label.toLowerCase() === unlockLabel.toLowerCase());
        if (unlockPoint && unlockPoint.marked) {
          if (!activeNums.includes(num)) activeNums.push(num);
        }
      }
      return activeNums;
    }

    function getHighestUnmarkedLifePoint() {
      const lifePoints = points.filter(p => p.label.toLowerCase().startsWith('life_point'));
      return lifePoints.find(p => !p.marked);
    }

    function triggerAutoFistMark() {
      const openFist = points.find(p => p.label.toLowerCase().startsWith('fist_') && !p.label.toLowerCase().includes('double') && !p.marked);
      if (openFist) {
        openFist.marked = true;
        return openFist;
      }
      return null;
    }

    function showBannerNotification(text) {
      const banner = document.getElementById('reward-banner');
      banner.textContent = text;
      banner.style.display = 'block';
    }

    function toggleEditLock() {
      allowEditingPoints = !allowEditingPoints;
      const btn = document.getElementById('btn-lock-edit');
      btn.textContent = allowEditingPoints ? '✏️ Edit/Delete: ENABLED' : '➕ Add Only Mode (Editing Locked)';
      btn.style.background = allowEditingPoints ? '#2563eb' : '#16a34a';
    }

    function updatePairsPanel(validPairs) {
      const container = document.getElementById('pairs-container');
      if (!validPairs || validPairs.length === 0) {
        container.innerHTML = '<div>No active pairs remaining. Roll dice to start!</div>';
        return;
      }

      const whitePairs = [];
      const blackPairs = [];

      validPairs.forEach(p => {
        const label = `${p.sum}${p.isDouble ? ' (Dbl)' : ''}`;
        if (p.usesBlack) {
          if (!blackPairs.includes(label)) blackPairs.push(label);
        } else {
          if (!whitePairs.includes(label)) whitePairs.push(label);
        }
      });

      let html = '';
      if (whitePairs.length > 0) {
        html += `<div><strong>Standard (White):</strong><br>`;
        whitePairs.forEach(lbl => html += `<span class="pair-tag tag-white">${lbl}</span>`);
        html += `</div>`;
      }
      if (blackPairs.length > 0) {
        html += `<div style="margin-top:6px;"><strong>Black Die Required:</strong><br>`;
        blackPairs.forEach(lbl => html += `<span class="pair-tag tag-black">${lbl}</span>`);
        html += `</div>`;
      }

      container.innerHTML = html;
    }

    function drawGreenCheckmark(px, py, radius) {
      ctx.fillStyle = '#16a34a';
      ctx.beginPath();
      ctx.arc(px, py, radius * 1.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(2, radius * 0.35);
      ctx.beginPath();
      ctx.moveTo(px - radius * 0.4, py);
      ctx.lineTo(px - radius * 0.1, py + radius * 0.35);
      ctx.lineTo(px + radius * 0.4, py - radius * 0.35);
      ctx.stroke();
    }

    function redraw() {
      syncCanvasSize();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const validPairs = poolDice.length >= 2 ? getValidPairs(poolDice) : [];
      updatePairsPanel(validPairs);

      points.forEach((p) => {
        const px = p.x * canvas.width;
        const py = p.y * canvas.height;
        const radius = Math.max(8, canvas.width * 0.012);

        const isTargetZone = p.label.toLowerCase().endsWith('_target');
        const isHpBox = isMonsterHpBox(p.label);
        const isBookkeeping = isBookkeepingPoint(p.label);

        let isHighlighted = false;
        let isBlackDieMove = false;

        if (validPairs.length > 0 && !p.marked && !isHpBox && !isBookkeeping) {
          const numVal = parseInt(p.label.replace(/\D/g, ''));
          const isDoubleReq = p.label.toLowerCase().includes('double');
          const isDoubleDoor = p.label.toLowerCase() === 'double_door';

          if (!isTargetZone) {
            const matches = validPairs.filter(pair => {
              if (isDoubleDoor) return pair.isDouble;
              if (numVal && pair.sum === numVal) {
                return isDoubleReq ? pair.isDouble : true;
              }
              if (isDoubleReq && !numVal) return pair.isDouble;
              return false;
            });

            if (matches.length > 0) {
              isHighlighted = true;
              isBlackDieMove = matches.every(m => m.usesBlack);
            }
          } else {
            const prefix = getMonsterPrefixFromTarget(p.label);
            if (prefix) {
              const nextHp = getNextUnmarkedMonsterBox(prefix);
              if (nextHp) {
                const activeNums = getActiveNumbersForMonster(prefix);
                const matches = validPairs.filter(pair => activeNums.includes(pair.sum));
                if (matches.length > 0) {
                  isHighlighted = true;
                  isBlackDieMove = matches.every(m => m.usesBlack);
                }
              }
            }
          }
        }

        if (isHighlighted) {
          if (isBlackDieMove) {
            ctx.fillStyle = 'rgba(168, 85, 247, 0.45)';
            ctx.strokeStyle = '#a855f7';
          } else {
            ctx.fillStyle = 'rgba(234, 179, 8, 0.45)';
            ctx.strokeStyle = '#eab308';
          }
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(px, py, isTargetZone ? radius * 1.5 : radius, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        }

        if (p.label.toLowerCase().includes('reward')) {
          if (p.state === 1) {
            drawGreenCheckmark(px, py, radius);
            return;
          } else if (p.state === 2) {
            ctx.strokeStyle = '#dc2626';
            ctx.lineWidth = Math.max(2, canvas.width / 300);
            ctx.beginPath();
            ctx.moveTo(px - radius, py - radius); ctx.lineTo(px + radius, py + radius);
            ctx.moveTo(px + radius, py - radius); ctx.lineTo(px - radius, py + radius);
            ctx.stroke();
            return;
          }
        }

        if (p.marked) {
          if (isHpBox || p.label.toLowerCase().startsWith('life_point')) {
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(px - radius/2, py - radius/2, radius, radius);
          } else {
            ctx.strokeStyle = '#dc2626';
            ctx.lineWidth = Math.max(2, canvas.width / 300);
            ctx.beginPath();
            ctx.moveTo(px - radius, py - radius); ctx.lineTo(px + radius, py + radius);
            ctx.moveTo(px + radius, py - radius); ctx.lineTo(px - radius, py + radius);
            ctx.stroke();
          }
        }

        if (calibrationMode) {
          ctx.fillStyle = 'rgba(59, 130, 246, 0.6)';
          ctx.strokeStyle = '#1d4ed8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(px, py, radius * 0.7, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = `${Math.max(10, canvas.width / 110)}px sans-serif`;
          ctx.fillText(p.label, px + radius + 2, py + 3);
        }
      });
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) / rect.width;
      const clickY = (e.clientY - rect.top) / rect.height;

      const threshold = calibrationMode ? 0.008 : 0.03;
      const hitIdx = points.findIndex(p => Math.hypot(p.x - clickX, p.y - clickY) < threshold);

      if (calibrationMode) {
        if (hitIdx >= 0 && allowEditingPoints) {
          const pt = points[hitIdx];
          const action = prompt(`Target "${pt.label}":\nType "1" to EDIT LABEL\nType "2" to DELETE point\nType "3" to CANCEL`, "1");
          if (action === "1") {
            const newLabel = prompt("Enter new label:", pt.label);
            if (newLabel) pt.label = newLabel.trim();
          } else if (action === "2") {
            points.splice(hitIdx, 1);
          }
        } else if (hitIdx < 0 || !allowEditingPoints) {
          const label = prompt("Enter label for new target:");
          if (label) {
            points.push({ label: label.trim(), x: Number(clickX.toFixed(4)), y: Number(clickY.toFixed(4)), marked: false, state: 0 });
          }
        }
      } else {
        if (hitIdx >= 0) {
          const pt = points[hitIdx];
          const lbl = pt.label.toLowerCase();

         if (pt.marked && !lbl.includes('reward')) {
  if (eraserMode) {
    pt.marked = false;
    showBannerNotification(`Erased mark from ${pt.label}`);
    redraw();
  }
  return;
}

          if (lbl.includes('reward')) {
            pt.state = (pt.state + 1) % 3;

            if (pt.state === 1) {
              let prefix = lbl.substring(0, lbl.indexOf('_reward'));
              if (prefix === 'boss') prefix = 'beefy_bearpion_boss';
              if (prefix === 'white-wolf') prefix = 'white_wolf';

              const gemsCount = monsterGemRewards[prefix] ? monsterGemRewards[prefix][1] : 3;

              if (prefix === 'beefy_bearpion_boss') {
                showBannerNotification(`👑 Boss Reward Claimed! Mark ${gemsCount} Gems on your score tracker. (Other players take 2 Life Damage)`);
              } else {
                showBannerNotification(`🏆 ${prefix.replace(/_/g, ' ')} 1st Reward Claimed! Mark ${gemsCount} Gems on your score tracker.`);
              }
            } else if (pt.state === 2) {
              showBannerNotification(`❌ 1st Reward marked as claimed by another player.`);
            }

            markHistory.push({ pt: pt, consumedDice: null, linkedPts: [], isRewardState: true });
            redraw();
            return;
          }

          if (lbl.startsWith('life_point')) {
            const highestOpen = getHighestUnmarkedLifePoint();
            if (highestOpen) {
              highestOpen.marked = true;
              markHistory.push({ pt: highestOpen, consumedDice: null, linkedPts: [] });
            }
            redraw();
            return;
          }

          if (isBookkeepingPoint(pt.label)) {
            pt.marked = !pt.marked;
            markHistory.push({ pt: pt, consumedDice: null, linkedPts: [] });
            redraw();
            return;
          }

          if (lbl.endsWith('_target')) {
            const prefix = getMonsterPrefixFromTarget(pt.label);
            const hpBox = getNextUnmarkedMonsterBox(prefix);

            if (hpBox) {
              const activeNums = getActiveNumbersForMonster(prefix);
              const validPairs = getValidPairs(poolDice);
              const match = validPairs.find(p => activeNums.includes(p.sum));

              if (match) {
                const consumed = consumeDiceForSum(match.sum, false, false);
                if (consumed) {
                  hpBox.marked = true;

                  const nextHp = getNextUnmarkedMonsterBox(prefix);
                  if (!nextHp) {
                    const r1st = points.find(p => p.label.toLowerCase().includes(prefix) && p.label.toLowerCase().endsWith('_reward_1st'));
                    
                    if (r1st && r1st.state === 0) {
                      r1st.state = 1;
                      const gemVal = monsterGemRewards[prefix] ? monsterGemRewards[prefix][1] : 3;
                      showBannerNotification(`🎉 Defeated ${prefix.replace(/_/g, ' ')}! Claimed 1st Reward: Mark ${gemVal} Gems on your score tracker.`);
                    } else {
                      const gemVal = monsterGemRewards[prefix] ? monsterGemRewards[prefix][2] : 1;
                      showBannerNotification(`⚔️ Defeated ${prefix.replace(/_/g, ' ')} (2nd Slayer)! Mark ${gemVal} Gem(s) on your score tracker.`);
                    }
                  }

                  markHistory.push({ pt: hpBox, consumedDice: consumed, linkedPts: [] });
                }
              }
            }
          } else {
            const numVal = parseInt(pt.label.replace(/\D/g, ''));
            const isDoubleReq = lbl.includes('double');
            const isDoubleDoor = lbl === 'double_door';

            if (!pt.marked && (numVal || isDoubleDoor)) {
              const consumed = consumeDiceForSum(numVal, isDoubleReq, isDoubleDoor);
              if (consumed) {
                pt.marked = true;
                const linkedPts = [];

                if (lbl.includes('fist_double')) {
                  const autoFist = triggerAutoFistMark();
                  if (autoFist) linkedPts.push(autoFist);
                }

                if (lbl.startsWith('gem_') && !isBottomGemGridPoint(lbl)) {
                  showBannerNotification("💎 Map Gem space collected! Mark 1 Gem on your score tracker.");
                }

                if (lbl.startsWith('gold_')) {
                  showBannerNotification("🎁 Gold space unlocked! Now you can choose one of the rewards.");
                }

                markHistory.push({ pt: pt, consumedDice: consumed, linkedPts: linkedPts });
              }
            }
          }
        }
      }
      redraw();
    });

    function rollDice() {
      if (poolDice.length > 0) {
        diceRollHistory.push([...poolDice]);
      }

      poolDice = [0,1,2,3,4].map(id => ({
        id: id,
        val: Math.floor(Math.random() * 6) + 1
      }));

      poolDice.forEach((d, i) => {
        document.getElementById(`d${i}`).textContent = d.val;
      });

      document.getElementById('reward-banner').style.display = 'none';
      redraw();
    }

    function undoDiceRoll() {
      if (diceRollHistory.length > 0) {
        poolDice = diceRollHistory.pop();
        poolDice.forEach((d, i) => {
          document.getElementById(`d${i}`).textContent = d.val;
        });
        redraw();
      }
    }

   function undoLastAction() {
  if (markHistory.length > 0) {
    const last = markHistory.pop();

    if (last.isRewardState) {
      last.pt.state = (last.pt.state + 2) % 3;
    } else {
      last.pt.marked = false; // Restores the gem/space if clicked by mistake
    }

    if (last.linkedPts && last.linkedPts.length > 0) {
      last.linkedPts.forEach(p => p.marked = false);
    }

    if (last.consumedDice && last.consumedDice.length > 0) {
      last.consumedDice.forEach(d => {
        if (!poolDice.some(existing => existing.id === d.id)) {
          poolDice.push(d);
        }
      });
      poolDice.sort((a, b) => a.id - b.id);
    }

    document.getElementById('reward-banner').style.display = 'none';
    redraw();
  }
}
function toggleEraserMode() {
  eraserMode = !eraserMode;
  const btn = document.getElementById('btn-eraser');
  if (eraserMode) {
    btn.textContent = '🔓 Eraser: ON';
    btn.style.background = '#e11d48'; // Highlights red when active
  } else {
    btn.textContent = '🔒 Eraser: OFF';
    btn.style.background = '#475569';
  }
}
    function toggleCalibration() {
      calibrationMode = !calibrationMode;
      document.getElementById('btn-mode').classList.toggle('active', calibrationMode);
      document.getElementById('calib-banner').style.display = calibrationMode ? 'flex' : 'none';
      redraw();
    }

    function clearMarks() {
      if (confirm("Reset all marked spaces?")) {
        points.forEach(p => { p.marked = false; p.state = 0; });
        markHistory = [];
        diceRollHistory = [];
        document.getElementById('reward-banner').style.display = 'none';
        redraw();
      }
    }

    function exportPoints() {
      const exportable = points.map(p => ({ label: p.label, x: p.x, y: p.y }));
      navigator.clipboard.writeText(JSON.stringify(exportable, null, 2));
      alert("Updated JSON dataset copied to clipboard!");
    }

    img.onload = () => { syncCanvasSize(); redraw(); };
    window.addEventListener('resize', () => { syncCanvasSize(); redraw(); });
  </script>
</body>
